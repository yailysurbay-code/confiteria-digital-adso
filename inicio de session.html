<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Confitería</title>
    <link rel="stylesheet" href="styles/inicio-de-session.css">
</head>
<body>

    <div class="contenedor">
        <div class="login">

            <h2>
                Bienvenido a nuestra<br>
                <span>confitería</span>
            </h2>

            <form>
                <input type="email" placeholder="Ingrese su correo">

                <input type="password" placeholder="Ingrese su clave de usuario">

                <div class="opciones">
                    <a href="#">No recuerdas tu contraseña?</a>
                    <a href="#" class="recuperar">Recuperar</a>
                </div>

                <button type="submit">Iniciar sesión</button>

                <div class="registro">
                    <p>No tienes una cuenta?</p>
                    <a href="registro.html">Crear cuenta</a>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
