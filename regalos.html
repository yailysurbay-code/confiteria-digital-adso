<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confitería Adso</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/regalo.css">
</head>

<body>

    <header>
        <input type="checkbox" id="menu-toggle-checkbox" class="menu-toggle-checkbox">

        <div class="derecha header-left">
            <div class="logo">
                <a href="index.html"><img class="logo-img" src="assets/logo sin fondo.png" alt="logo"></a>
            </div>
            <hr>
            <nav class="navegacion">
                <ul>
                    <li class="activo"><a href="pedidos.html">Pedidos</a></li>
                    <li class="activo"><a href="preferencial.html">Preferencial</a></li>
                    <li class="activo"><a href="quienes-somos.html">Quienes Somos</a></li>
                    <li class="mobile-only"><a href="inicio de session.html" class="sesion">Iniciar Sesión</a></li>
                    <li class="mobile-only"><a href="registro.html" class="registro">Registro</a></li>
                </ul>
            </nav>
        </div>

        <div class="derecha header-right">
            <a href="carrito.html" class="carrito">
                <img class="carrito-img" src="assets/regalo/carro-de-la-compra 1.svg" alt="Carrito">
            </a>
            <a href="inicio de session.html" class="sesion desktop-only">Iniciar Sesión</a>
            <a href="registro.html" class="registro desktop-only">Registro</a>
            <label for="menu-toggle-checkbox" class="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </label>
        </div>

    </header>
    <section class="categoria">

        <a href="index.html" class="btn-categoria dulceria">Dulceria</a>
        <a href="regalos.html" class="btn-categoria regalo">Regalos</a>
    </section>

    <section class="banner">

        <img class="banner-img" src="./assets/regalo/banner 1 - copia.png" alt="banner">


    </section>

    <hr>
    <section class="vitrina-productos">
        <aside class="filtrado">

            <div class="seccion-filtro">
                <div class="encabezado-filtro">
                    <h3>Marca</h3>
                    <span class="icono-flecha">&#x2304;</span>
                </div>

                <div class="caja-busqueda">
                    <input type="text" placeholder="Ingrese una marca">
                    <span class="icono-buscar">&#x1F50D;</span>
                </div>

                <ul class="lista-filtros">
                    <li>
                        <label class="contenedor-radio">
                            <input type="radio" name="filtro-marca" checked>
                            <span class="punto-color punto-todas"></span>
                            <span class="texto-etiqueta">Todas las marcas <span class="contador">(7)</span></span>
                        </label>
                    </li>
                    <li>
                        <label class="contenedor-radio">
                            <input type="radio" name="filtro-marca">
                            <span class="punto-color punto-colombina"></span>
                            <span class="texto-etiqueta">Madres<span class="contador">(6)</span></span>
                        </label>
                    </li>
                    <li>
                        <label class="contenedor-radio">
                            <input type="radio" name="filtro-marca">
                            <span class="punto-color punto-jet"></span>
                            <span class="texto-etiqueta">Padres <span class="contador">(1)</span></span>
                        </label>
                    </li>
                    <li>
                        <label class="contenedor-radio deshabilitado">
                            <input type="radio" name="filtro-marca" disabled>
                            <span class="punto-color punto-yupis"></span>
                            <span class="texto-etiqueta">Cumpleaños<span class="contador">(0)</span></span>
                        </label>
                    </li>
                    <li>
                        <label class="contenedor-radio deshabilitado">
                            <input type="radio" name="filtro-marca" disabled>
                            <span class="punto-color punto-ferrero"></span>
                            <span class="texto-etiqueta">Aniversario <span class="contador">(0)</span></span>
                        </label>
                    </li>
                    <li>
                        <label class="contenedor-radio deshabilitado">
                            <input type="radio" name="filtro-marca" disabled>
                            <span class="punto-color punto-ramo"></span>
                            <span class="texto-etiqueta">Amor y Amistad <span class="contador">(0)</span></span>
                        </label>
                    </li>
                </ul>
                <a href="#" class="ver-mas">Ver más</a>
            </div>

            <hr class="linea-divisoria">

            <div class="seccion-filtro">
                <div class="encabezado-filtro">
                    <h3>Precio</h3>
                    <span class="icono-flecha">&#x2304;</span>
                </div>
                <div class="contenedor-rango tema-verde">
                    <input type="range" min="100" max="1000" value="500" class="deslizador">
                    <div class="etiquetas-rango">
                        <span>$100</span>
                        <span class="valor-actual">$500</span>
                        <span>$1000</span>
                    </div>
                </div>
            </div>

            <hr class="linea-divisoria">

            <div class="seccion-filtro">
                <div class="encabezado-filtro">
                    <h3>Cantidad</h3>
                    <span class="icono-flecha">&#x2304;</span>
                </div>
                <div class="contenedor-rango tema-naranja">
                    <input type="range" min="1" max="10" value="5" class="deslizador">
                    <div class="etiquetas-rango">
                        <span>1</span>
                        <span class="valor-actual">5</span>
                        <span>10</span>
                    </div>
                </div>
            </div>

        </aside>

        <section class="productos">

            <div class="card">
                <img class="card-img" src="./assets/regalo/oso.png" alt="chocolate"
                    style="width: 237px;height: 203px;">
                <div class="items">
                    <div class="top">
                        <h3>oso</h3>
                        <p>$30000</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>

            <div class="card">
                <img class="card-img" src="./assets/regalo/ramo.png" alt="" style="width: 232px;height: 202px;">
                <div class="items">
                    <div class="top">
                        <h3>ramo</h3>
                        <p>$25.000</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>

            <div class="card">
                <img class="card-img" src="./assets/regalo/caja con dijen.png" alt="" style="width: 212px;height: 203px;">
                <div class="items">
                    <div class="top">
                        <h3>caja con dijen</h3>
                        <p>$16.000</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>

            <div class="card">
                <img class="card-img" src="./assets/regalo/carta.png" alt="" style="width: 198px;height: 198px;">
                <div class="items">
                    <div class="top">
                        <h3>carta</h3>
                        <p>$16.900</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>

            <div class="card">
                <img class="card-img" src="./assets/regalo/caja de chocolate.png" alt="" style="width: 237px;height: 204px;">
                <div class="items">
                    <div class="top">
                        <h3>caja de chocolate</h3>
                        <p>$20.000</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>

            <div class="card">
                <img class="card-img" src="./assets/regalo/retrato.png" alt="" style="width: 250px;height: 242px;">
                <div class="items">
                    <div class="top">
                        <h3>retrato</h3>
                        <p>$5.000</p>
                    </div>
                    <button class="agregar-carrito">
                        <img class="icono" src="/assets/regalo/carro-de-la-compra 1.svg" alt="Agregar al carrito">
                    </button>
                </div>
            </div>
        </section>
    </section>
    <section class="videos">
        <div class="videos-producto">
            <div class="tarjeta-videos">
                <video width="100%" height="100%" controls>
                    <source src="./assets/regalo/cumpleaños.mp4" type="video/mp4">
                </video>
                
            </div>
        </div>
    </section>
