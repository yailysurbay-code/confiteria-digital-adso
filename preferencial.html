<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS Store</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/preferencial.css">
</head>
<body>

    <header>
        <input type="checkbox" id="menu-toggle-checkbox" class="menu-toggle-checkbox">

        <div class="derecha header-left">
            <div class="logo">
                <a href="index.html"><img class="logo-img" src="assets/logo sin fondo.png" alt="logo"></a>
            </div>
            <hr>
            <nav class="navegacion">
                <ul>
                    <li class="activo"><a href="pedidos.html">Pedidos</a></li>
                    <li class="activo"><a href="preferencial.html">Preferencial</a></li>
                    <li class="activo"><a href="quienes-somos.html">Quienes Somos</a></li>
                    <li class="mobile-only"><a href="inicio de session.html" class="sesion">Iniciar Sesión</a></li>
                    <li class="mobile-only"><a href="registro.html" class="registro">Registro</a></li>
                </ul>
            </nav>
        </div>

        <div class="derecha header-right">
            <a href="carrito.html" class="carrito">
                <img class="carrito-img" src="assets/dulceria/carro-de-la-compra 1.svg" alt="Carrito">
            </a>
            <a href="inicio de session.html" class="sesion desktop-only">Iniciar Sesión</a>
            <a href="registro.html" class="registro desktop-only">Registro</a>
            <label for="menu-toggle-checkbox" class="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </label>
        </div>

    </header>

    <section class="slider">

        <div class="slides">

            <div class="slide">
                <img src="assets/preferencial/sline1.png" alt="Banner 1">
            </div>

            <div class="slide">
                <img src="assets/preferencial/sline2.png" alt="Banner 2">
            </div>

            <div class="slide">
                <img src="assets/preferencial/sline3.png" alt="Banner 3">
            </div>

            <div class="slide">
                <img src="assets/preferencial/sline4.png" alt="Banner 4">
            </div>
            <div class="slide">
                <img src="assets/preferencial/sline5.png" alt="Banner 5">
            </div>

        </div>

    </section>

    <!-- INDICADORES -->
    <div class="slider-dots">
        <span></span>
        <span class="activo"></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- TITULO -->
    <div class="titulo">
        <span>Exclusivos</span>
    </div>

    <!-- PRODUCTOS -->
    <section class="productos">

        <div class="card">
            <img src="assets/preferencial/reloj.png" alt="">
            <h3>Reloj Rolex</h3>
            <p>$30.000</p>
        </div>

        <div class="card">
            <img src="assets/preferencial/oso.png" alt="">
            <h3>Osito</h3>
            <p>$30.000</p>
        </div>

        <div class="card">
            <img src="assets/preferencial/jabones.png" alt="">
            <h3>Jabones</h3>
            <p>$30.000</p>
        </div>

        <div class="card">
            <img src="assets/preferencial/chocoramo.png" alt="">
            <h3>Chocorramo</h3>
            <p>$3.500</p>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <a href="#">Productos</a>
        <a href="#">Mis pedidos</a>
        <a href="#">Quienes somos</a>
    </footer>

</body>
</html>
